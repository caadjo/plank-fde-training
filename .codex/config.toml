[agents]
enabled = true
max_concurrent_threads_per_session = 3

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"

[mcp_servers.workbot_database]
command = "pnpm"
args = ["exec", "tsx", "mcp/database.ts"]
startup_timeout_sec = 30

[mcp_servers.workbot_posthog]
command = "pnpm"
args = ["exec", "tsx", "mcp/posthog.ts"]
startup_timeout_sec = 30
